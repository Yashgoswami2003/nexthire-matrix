    <script src="https://cdn.tailwindcss.com"></script>

<body class="bg-gradient-to-br from-slate-50 via-indigo-50/30 to-slate-100 dark:from-slate-950 dark:via-slate-900 dark:to-indigo-950/40 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300">

    <header class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex justify-between items-center">
            <div class="text-sm sm:text-xl font-extrabold bg-gradient-to-r from-indigo-600 via-violet-600 to-pink-600 bg-clip-text text-transparent flex items-center gap-2 cursor-pointer" onclick="window.location.href='index.html'">
                <span class="p-1.5 bg-indigo-50 dark:bg-indigo-950/80 rounded-xl shadow-inner text-indigo-600 dark:text-indigo-400"><i class="fa-solid fa-bolt"></i></span> NextHire Matrix
            </div>
            <button onclick="document.getElementById('htmlRoot').classList.toggle('dark')" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 transition text-sm font-semibold"><i class="fa-solid fa-moon"></i></button>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 pt-6 w-full overflow-x-auto">
        <div class="flex justify-start lg:justify-center gap-2 bg-white/80 dark:bg-slate-800/80 backdrop-blur-md p-1.5 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 w-fit mx-auto shadow-sm text-xs font-extrabold">
            <a href="index.html" class="px-3.5 py-2 rounded-xl text-slate-600 dark:text-slate-300 hover:text-indigo-600 transition whitespace-nowrap"><i class="fa-solid fa-wand-magic-sparkles mr-1"></i> Build Resume</a>
            <a href="ats-checker.html" class="px-3.5 py-2 rounded-xl text-slate-600 dark:text-slate-300 hover:text-indigo-600 transition whitespace-nowrap"><i class="fa-solid fa-file-arrow-up mr-1"></i> ATS Checker</a>
            <a href="interview-prep.html" class="px-3.5 py-2 rounded-xl text-slate-600 dark:text-slate-300 hover:text-indigo-600 transition whitespace-nowrap"><i class="fa-solid fa-lightbulb mr-1"></i> Interview Prep Hub</a>
            <a href="mock-interview.html" class="px-3.5 py-2 rounded-xl bg-indigo-600 text-white shadow-md shadow-indigo-600/25 transition whitespace-nowrap"><i class="fa-solid fa-robot mr-1"></i> Mock HR & Tech Interviewer</a>
            <a href="test-series.html" class="px-3.5 py-2 rounded-xl text-slate-600 dark:text-slate-300 hover:text-indigo-600 transition whitespace-nowrap"><i class="fa-solid fa-bullseye mr-1"></i> Test Series Hub</a>
            <a href="salary-estimator.html" class="px-3.5 py-2 rounded-xl text-slate-600 dark:text-slate-300 hover:text-indigo-600 transition whitespace-nowrap"><i class="fa-solid fa-wallet mr-1"></i> Salary Estimator</a>
            <a href="cover-letter.html" class="px-3.5 py-2 rounded-xl text-slate-600 dark:text-slate-300 hover:text-indigo-600 transition whitespace-nowrap"><i class="fa-solid fa-envelope-open-text mr-1"></i> Cover Letter</a>
            <a href="job-matcher.html" class="px-3.5 py-2 rounded-xl text-slate-600 dark:text-slate-300 hover:text-indigo-600 transition whitespace-nowrap"><i class="fa-solid fa-magnifying-glass mr-1"></i> Job Matcher</a>
        </div>
    </div>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8 flex-grow w-full">
        <div class="max-w-3xl mx-auto bg-white/90 dark:bg-slate-800/95 backdrop-blur-xl p-8 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-700 space-y-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b border-slate-100 dark:border-slate-700 pb-4">
                <h1 class="text-xl font-black text-slate-800 dark:text-slate-100"><i class="fa-solid fa-robot text-indigo-600 mr-2"></i> Mock HR & Tech Interviewer</h1>
                <span id="mockQuestionCounter" class="text-xs font-extrabold bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 px-3 py-1.5 rounded-xl">Question 1 of 10</span>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1.5">Select Interview Track / Role</label>
                <select id="mockRoleSelect" onchange="resetMockInterview()" class="w-full px-4 py-2.5 border border-indigo-200 dark:border-indigo-800 rounded-2xl text-xs bg-white dark:bg-slate-900 font-bold focus:outline-none">
                    <option value="Full Stack Web Dev (Django+React)">Full Stack Web Dev (Django + React)</option>
                    <option value="Python & Data Structures">Python & Data Structures</option>
                    <option value="HR & Behavioral Round">HR & Behavioral Round</option>
                    <option value="Data Science & Machine Learning">Data Science & Machine Learning</option>
                    <option value="DevOps & Cloud Engineering">DevOps & Cloud Engineering</option>
                </select>
            </div>

            <div class="space-y-4">
                <div class="p-5 bg-indigo-50/50 dark:bg-indigo-950/40 rounded-2xl border border-indigo-100 dark:border-indigo-900 space-y-1.5">
                    <span class="text-[10px] font-black uppercase tracking-wider text-indigo-500">Interviewer Question:</span>
                    <h2 id="mockQuestionText" class="text-sm font-bold text-slate-800 dark:text-slate-100">Loading question...</h2>
                </div>
                
                <textarea id="mockUserAnswer" rows="4" placeholder="Type your detailed answer here (explain concepts, examples, or approach)..." class="w-full p-4 border border-slate-200 dark:border-slate-700 rounded-2xl text-xs bg-slate-50 dark:bg-slate-900 font-medium focus:outline-none focus:border-indigo-500"></textarea>
                
                <div class="flex gap-3">
                    <button onclick="submitMockAnswer()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-2xl font-extrabold text-xs shadow-lg transition">Submit Answer & Get AI Analysis <i class="fa-solid fa-rocket ml-1"></i></button>
                    <button onclick="nextMockQuestion()" id="nextMockBtn" class="hidden bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-2xl font-extrabold text-xs shadow-lg transition">Next Question <i class="fa-solid fa-arrow-right ml-1"></i></button>
                </div>

                <div id="mockEvalBox" class="hidden p-5 bg-slate-50 dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-700 space-y-2.5">
                    <div class="flex justify-between items-center border-b border-slate-200 dark:border-slate-800 pb-2">
                        <h3 id="mockScoreNum" class="text-base font-black text-indigo-600">Score: 0/100</h3>
                        <span id="mockGradeBadge" class="text-[10px] font-black px-2.5 py-1 rounded-lg bg-emerald-100 text-emerald-700">GOOD</span>
                    </div>
                    <p id="mockFeedbackText" class="text-xs text-slate-700 dark:text-slate-300 font-medium leading-relaxed"></p>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-t border-slate-200/80 dark:border-slate-800 py-8 mt-12 text-center text-xs text-slate-600 dark:text-slate-400 font-semibold">
        <p>© 2026 NextHire Matrix. All rights reserved.</p>
    </footer>

    <script>
        const mockBanks = {
            "Full Stack Web Dev (Django+React)": [
                "How does Django's MVT architecture differ from traditional MVC?",
                "Explain React's Virtual DOM and how reconciliation works.",
                "How do you handle CORS and JWT authentication between Django and React?",
                "What is the N+1 query problem in Django ORM and how do you fix it?",
                "Explain the difference between useEffect and useMemo in React.",
                "How do you optimize a slow PostgreSQL query in a production Django app?",
                "What are Django middlewares and when would you write a custom one?",
                "How do you manage global state in large React applications?",
                "Explain CSRF protection in Django and how it works.",
                "How would you deploy a Django + React app with zero downtime?"
            ],
            "Python & Data Structures": [
                "What is the difference between a list, tuple, and set in Python?",
                "Explain Python's Global Interpreter Lock (GIL) and its impact on multithreading.",
                "How does a dictionary work internally in Python (hashing & collisions)?",
                "What are decorators and generators in Python? Give a practical use case.",
                "Explain the time and space complexity of QuickSort vs MergeSort.",
                "How do you detect a cycle in a Linked List?",
                "What is the difference between shallow copy and deep copy in Python?",
                "How would you implement an LRU Cache?",
                "Explain BFS vs DFS and when to use each.",
                "How does Python's garbage collection and reference counting work?"
            ],
            "HR & Behavioral Round": [
                "Tell me about yourself and your technical journey so far.",
                "Describe a challenging bug or project deadline you faced and how you handled it.",
                "Why do you want to join our company and what motivates you?",
                "Tell me about a time you disagreed with a teammate. How did you resolve it?",
                "What is your biggest strength and one area you are actively improving?",
                "Where do you see yourself in the next 3 to 5 years?",
                "How do you prioritize tasks when working on multiple deadlines?",
                "Describe a project you built from scratch that you are most proud of.",
                "How do you handle constructive criticism from a senior or manager?",
                "Do you have any questions for us?"
            ],
            "Data Science & Machine Learning": [
                "Explain the bias-variance tradeoff in machine learning.",
                "What is the difference between supervised, unsupervised, and reinforcement learning?",
                "How do you handle missing values and outliers in a dataset?",
                "Explain Precision, Recall, F1-Score, and when to use which.",
                "What is overfitting and how do you prevent it (Regularization, Dropout)?",
                "How does Random Forest work compared to Gradient Boosting (XGBoost)?",
                "Explain how Principal Component Analysis (PCA) reduces dimensionality.",
                "What is cross-validation and why is K-Fold important?",
                "How do you evaluate a regression model (RMSE, MAE, R2)?",
                "Explain how a neural network learns using backpropagation."
            ],
            "DevOps & Cloud Engineering": [
                "What is the difference between a Docker container and a Virtual Machine?",
                "Explain CI/CD pipelines and how you would set one up using GitHub Actions.",
                "What is Kubernetes and how do Pods, Services, and Deployments work?",
                "Explain the difference between horizontal and vertical scaling.",
                "How do you manage secrets and environment variables securely in production?",
                "What is Infrastructure as Code (IaC) and why is Terraform popular?",
                "Explain how a Load Balancer works and different routing algorithms.",
                "How do you monitor application health and logs in cloud environments?",
                "What is a reverse proxy (Nginx) and why is it used in front of app servers?",
                "Explain Blue-Green vs Canary deployment strategies."
            ]
        };

        let currentMockIdx = 0;
        let currentRole = "Full Stack Web Dev (Django+React)";

        window.onload = function() {
            loadMockQuestion();
        };

        function resetMockInterview() {
            currentRole = document.getElementById('mockRoleSelect').value;
            currentMockIdx = 0;
            loadMockQuestion();
        }

        function loadMockQuestion() {
            const questions = mockBanks[currentRole] || mockBanks["Full Stack Web Dev (Django+React)"];
            document.getElementById('mockQuestionCounter').innerText = `Question ${currentMockIdx + 1} of ${questions.length}`;
            document.getElementById('mockQuestionText').innerText = questions[currentMockIdx];
            document.getElementById('mockUserAnswer').value = '';
            document.getElementById('mockEvalBox').classList.add('hidden');
            document.getElementById('nextMockBtn').classList.add('hidden');
        }

        function submitMockAnswer() {
            const ans = document.getElementById('mockUserAnswer').value.trim();
            if (ans.length < 10) {
                alert("Please write a slightly more detailed answer (at least 10 characters) for AI evaluation.");
                return;
            }

            // Dynamic scoring based on answer depth & keywords
            let score = 65;
            if (ans.length > 50) score += 10;
            if (ans.length > 120) score += 10;
            if (ans.includes("example") || ans.includes("because") || ans.includes("performance") || ans.includes("scale") || ans.includes("time")) score += 10;
            score = Math.min(score, 96);

            document.getElementById('mockScoreNum').innerText = `Score: ${score}/100`;
            document.getElementById('mockGradeBadge').innerText = score >= 85 ? "EXCELLENT 🏆" : score >= 75 ? "GOOD 👍" : "NEEDS DETAIL 💡";
            document.getElementById('mockFeedbackText').innerText = score >= 85 
                ? "Strong, well-structured technical articulation! You covered the core concept clearly. Adding a real-world production metric would make it 10/10."
                : "Good start! Try explaining the 'why' behind your approach and include a concrete example or edge-case handling to boost your score.";

            document.getElementById('mockEvalBox').classList.remove('hidden');
            document.getElementById('nextMockBtn').classList.remove('hidden');
        }

        function nextMockQuestion() {
            const questions = mockBanks[currentRole] || mockBanks["Full Stack Web Dev (Django+React)"];
            currentMockIdx++;
            if (currentMockIdx >= questions.length) {
                alert("🎉 Congratulations! You completed all 10 Mock Interview questions for " + currentRole + ". Resetting to Question 1.");
                currentMockIdx = 0;
            }
            loadMockQuestion();
        }
    </script>
</body>
</html>
