<!DOCTYPE html>
<html lang="en" id="htmlRoot" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Cover Letter Generator - NextHire Matrix</title>
    
    <link rel="canonical" href="https://www.nexthirematrix.com/cover-letter.html">
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js" integrity="sha512-H2hDLxAUzyC63n0JvazGDF98DJCWFnVgyjFZSeAZhxww7gWJSIuVmjqNHDtLRvGB9hV0xPqJirO57jkOoWXCWQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body class="bg-gradient-to-br from-slate-50 via-indigo-50/30 to-slate-100 dark:from-slate-950 dark:via-slate-900 dark:to-indigo-950/40 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col">

    <header class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800 sticky top-0 z-50 p-4 flex justify-between items-center">
        <h1 class="text-sm font-extrabold text-indigo-600 cursor-pointer" onclick="window.location.href='index.html'">NextHire Matrix - Cover Letter</h1>
        <button onclick="document.getElementById('htmlRoot').classList.toggle('dark')" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 text-xs font-semibold"><i class="fa-solid fa-moon"></i></button>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-12 flex-grow w-full space-y-6">
        <div class="text-center space-y-2">
            <h2 class="text-2xl font-black">AI Cover Letter Generator</h2>
            <p class="text-xs text-slate-500">Generate professional, tailored cover letters instantly for your job applications.</p>
        </div>

        <div class="bg-white dark:bg-slate-900 p-8 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-800 space-y-5">
            <div>
                <label class="block text-xs font-bold mb-1.5 uppercase">Candidate Name & Role</label>
                <input type="text" id="clNameRole" placeholder="e.g. Yash Raj Goswami - Full Stack Engineer" class="w-full px-4 py-3 border border-slate-200 dark:border-slate-700 rounded-2xl text-xs bg-slate-50 dark:bg-slate-800 focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-bold mb-1.5 uppercase">Company Name & Job Description Highlights</label>
                <textarea id="clCompanyDetails" rows="4" placeholder="Enter company name and key requirements..." class="w-full p-4 border border-slate-200 dark:border-slate-700 rounded-2xl text-xs bg-slate-50 dark:bg-slate-800 focus:outline-none"></textarea>
            </div>
            <button onclick="generateCoverLetter()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3.5 rounded-2xl font-extrabold text-xs shadow-lg">Generate Cover Letter ✍️</button>

            <div id="clOutputBox" class="p-6 bg-slate-50 dark:bg-slate-800 rounded-2xl space-y-3 hidden">
                <h3 class="text-xs font-black uppercase text-indigo-600">Generated Cover Letter</h3>
                <p id="clOutputText" class="text-xs text-slate-700 dark:text-slate-300 font-medium whitespace-pre-line">Dear Hiring Manager,\n\nI am thrilled to apply for the position...</p>
            </div>
        </div>
    </main>

    <footer class="bg-white/80 dark:bg-slate-900/80 border-t border-slate-200 py-8 text-center text-xs text-slate-500">
        <p>© 2026 NextHire Matrix. All rights reserved.</p>
    </footer>

    <script>
        function generateCoverLetter() {
            const val = document.getElementById('clNameRole').value.trim();
            if(!val) { alert("Please enter your name and role!"); return; }
            document.getElementById('clOutputBox').classList.remove('hidden');
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        }
    </script>
</body>
</html>
