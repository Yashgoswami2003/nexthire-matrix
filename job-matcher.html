            <textarea id="jdInput" rows="5" placeholder="Paste Job Description here..." class="w-full p-3 border border-slate-200 dark:border-slate-700 rounded-2xl text-xs bg-slate-50 dark:bg-slate-900 font-medium"></textarea>

            <div id="jdResultBox" class="hidden space-y-2 pt-3 border-t border-slate-100 dark:border-slate-700">
                <h2 id="jdMatchScoreTitle" class="text-base font-black text-indigo-600">Match Score: 88% (ATS Optimized)</h2>
                <div id="jdMissingKeywordsBox" class="flex flex-wrap gap-2">

        function analyzeJobMatch() {
            document.getElementById('jdResultBox').classList.remove('hidden');
        }
    </script>
